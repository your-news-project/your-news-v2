<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>홍보 게시물 승인 상세</title>
    <link rel="stylesheet" href="/admin/css/detail.css">
    <style>
        .container { max-width: 760px; }
        .detail-group { align-items: flex-start; }
        .detail-group span { word-break: break-word; white-space: pre-wrap; }
        .link-list { flex: 1; margin: 0; padding-left: 20px; }
        .link-list li { margin-bottom: 8px; word-break: break-all; }
        .link-list a { color: #3f51b5; }
        #approve-button { background-color: #16803c; }
        #reject-button { background-color: #e11d48; }
        .action-buttons button:disabled { background-color: #aaa; cursor: not-allowed; }
        dialog { width: min(520px, calc(100% - 40px)); border: 0; border-radius: 12px; padding: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
        dialog::backdrop { background: rgba(0, 0, 0, .45); }
        dialog h3 { margin: 0 0 10px; }
        dialog p { margin: 0 0 14px; color: #555; }
        dialog textarea { width: 100%; min-height: 130px; box-sizing: border-box; resize: vertical; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .dialog-actions button { padding: 9px 18px; border: 0; border-radius: 6px; cursor: pointer; }
        #confirm-reject-button { color: #fff; background: #e11d48; }
    </style>
</head>
<body>
<div class="container">
    <h2>홍보 게시물 승인 상세</h2>

    <div class="detail-group"><strong>ID:</strong> <span id="detail-id"></span></div>
    <div class="detail-group"><strong>작성자 ID:</strong> <span id="detail-user-id"></span></div>
    <div class="detail-group"><strong>제목:</strong> <span id="detail-name"></span></div>
    <div class="detail-group"><strong>소개:</strong> <span id="detail-description"></span></div>
    <div class="detail-group"><strong>게시물 유형:</strong> <span id="detail-content-type"></span></div>
    <div class="detail-group"><strong>홍보 URL:</strong> <ul id="detail-service-urls" class="link-list"></ul></div>
    <div class="detail-group"><strong>상태:</strong> <span id="detail-status"></span></div>
    <div class="detail-group" id="rejection-reason-group" hidden><strong>반려 사유:</strong> <span id="detail-rejection-reason"></span></div>
    <div class="detail-group"><strong>이미지 URL:</strong> <ul id="detail-image-urls" class="link-list"></ul></div>
    <div class="detail-group"><strong>신고 수:</strong> <span id="detail-report-count"></span></div>
    <div class="detail-group"><strong>등록일:</strong> <span id="detail-created-at"></span></div>
    <div class="detail-group"><strong>수정일:</strong> <span id="detail-updated-at"></span></div>

    <div class="action-buttons">
        <button id="approve-button">승인</button>
        <button id="reject-button">반려</button>
        <button id="back-button">목록으로</button>
    </div>
</div>

<dialog id="reject-dialog">
    <h3>홍보 게시물 반려</h3>
    <p>작성자에게 전달할 반려 사유를 입력해주세요.</p>
    <textarea id="rejection-reason" maxlength="500" placeholder="예: 등록한 링크에 접속할 수 없습니다."></textarea>
    <div class="dialog-actions">
        <button type="button" id="cancel-reject-button">취소</button>
        <button type="button" id="confirm-reject-button">반려하기</button>
    </div>
</dialog>

<script src="/admin/js/utils/fetchWithAuth.js"></script>
<script src="/admin/js/auth-check.js"></script>
<script th:inline="javascript">
    const studentServiceId = /*[[${studentServiceId}]]*/ 0;
</script>
<script src="/admin/js/student-service-detail.js"></script>
</body>
</html>
