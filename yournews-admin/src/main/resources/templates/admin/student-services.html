<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>홍보 게시물 승인 관리</title>
    <link rel="stylesheet" href="/admin/css/style.css">
    <style>
        .container { max-width: 1100px; }
        .empty-row { text-align: center; color: #777; }
        .service-name { max-width: 260px; word-break: break-word; }
    </style>
</head>
<body>
<div class="container">
    <h2>홍보 게시물 승인 관리</h2>

    <div class="category-select">
        <label for="status">상태:</label>
        <select id="status">
            <option value="PENDING" selected>승인 대기</option>
            <option value="APPROVED">승인</option>
            <option value="REJECTED">거절</option>
            <option value="HIDDEN">숨김</option>
            <option value="">전체</option>
        </select>
        <button id="load-button">불러오기</button>
        <button id="dashboard-button" class="secondary-button">대시보드</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>게시물 유형</th>
            <th>상태</th>
            <th>이미지</th>
            <th>등록일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody id="student-service-table-body"></tbody>
    </table>

    <div id="pagination" class="pagination"></div>
</div>

<script src="/admin/js/utils/fetchWithAuth.js"></script>
<script src="/admin/js/auth-check.js"></script>
<script src="/admin/js/student-services.js"></script>
</body>
</html>
